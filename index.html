<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EtherCAT 交互学习系统 — 基于 ETG EtherCAT Compendium</title>
<meta name="description" content="系统化、可交互、可实验的 EtherCAT 学习系统：Frame、ESC、FMMU、SyncManager、PDO、Mailbox、CoE、ESM、Distributed Clocks、诊断与虚拟实验。">
<style>
/* ============================================================
   EtherCAT 交互学习系统 — style.css
   双主题 / 三栏布局 / 组件库 / 动画
   ============================================================ */

/* ---------- 主题变量 ---------- */
:root{
  --bg:#f6f7f9; --bg2:#ffffff; --panel:#ffffff; --panel2:#f0f2f5;
  --line:#dde1e7; --line2:#c9cfd8;
  --tx:#1c2330; --tx2:#5a6474; --tx3:#8a93a3;
  --acc:#d8391f; --acc-soft:rgba(216,57,31,.09);
  --cyan:#0e7c86; --cyan-soft:rgba(14,124,134,.10);
  --blue:#2456c4; --blue-soft:rgba(36,86,196,.10);
  --green:#177a3d; --green-soft:rgba(23,122,61,.10);
  --amber:#9a6b00; --amber-soft:rgba(214,158,0,.14);
  --purple:#6d3fc0; --purple-soft:rgba(109,63,192,.10);
  --code-bg:#f0f2f5; --canvas:#0e1522; --canvas-line:#2a3650; --canvas-tx:#c7d2e8;
  --shadow:0 1px 3px rgba(15,25,40,.08),0 8px 24px rgba(15,25,40,.06);
  --r:10px; --r2:14px;
  --mono:ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace;
}
[data-theme=dark]{
  --bg:#0b111d; --bg2:#0e1626; --panel:#131c2e; --panel2:#1a2438;
  --line:#26324a; --line2:#33415e;
  --tx:#dbe3f0; --tx2:#97a3b8; --tx3:#69758c;
  --acc:#ff5a3c; --acc-soft:rgba(255,90,60,.13);
  --cyan:#3fc1ce; --cyan-soft:rgba(63,193,206,.13);
  --blue:#6f97ff; --blue-soft:rgba(111,151,255,.14);
  --green:#4cc07a; --green-soft:rgba(76,192,122,.13);
  --amber:#e5b545; --amber-soft:rgba(229,181,69,.14);
  --purple:#b18cff; --purple-soft:rgba(177,140,255,.14);
  --code-bg:#0d1421; --canvas:#0a0f1a; --canvas-line:#26324a; --canvas-tx:#c7d2e8;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.75 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:.08em .38em;color:var(--tx)}
button{font:inherit;color:inherit}
::selection{background:var(--acc-soft)}
p{margin:.35em 0 .9em}
strong{color:var(--tx);font-weight:650}
small{color:var(--tx2)}

/* ---------- 顶栏 ---------- */
#topbar{
  position:fixed;inset:0 0 auto 0;height:56px;z-index:60;
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;cursor:pointer}
.brand-logo{width:26px;height:26px;border-radius:7px;background:var(--acc);position:relative;flex:none}
.brand-logo::after{content:"";position:absolute;left:5px;right:5px;top:7px;height:3px;border-radius:2px;background:#fff;box-shadow:0 5px 0 #fff,0 10px 0 #fff}
.brand-text{font-weight:700;font-size:15.5px}
.brand-sub{font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;text-decoration:none!important}
.icon-btn:hover{border-color:var(--acc);color:var(--acc)}
#btn-menu{display:none}
.top-progress{display:flex;align-items:center;gap:8px;margin-left:auto}
.progress-track{width:130px;height:6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
#progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff9068);transition:width .5s}
#progress-num{font-size:12px;color:var(--tx2);font-family:var(--mono);min-width:36px}
#search-wrap{position:relative;flex:0 1 340px;min-width:140px}
#search{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--tx);padding:0 12px;font-size:13.5px;outline:none}
#search:focus{border-color:var(--cyan)}
#search-drop{position:absolute;top:40px;left:0;right:-60px;max-width:460px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);z-index:80;padding:6px}
.sr-head{font-size:11px;color:var(--tx3);padding:5px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
.sr-item{display:block;padding:7px 10px;border-radius:8px;cursor:pointer}
.sr-item:hover,.sr-item.sel{background:var(--panel2)}
.sr-item b{display:block;font-size:13.5px;font-weight:600;color:var(--tx)}
.sr-item span{font-size:12px;color:var(--tx2);display:block;line-height:1.5}
.sr-item .sr-ch{font-size:11px;color:var(--cyan);font-family:var(--mono)}

/* ---------- 布局 ---------- */
#layout{display:flex;min-height:100vh;padding-top:56px}
#sidebar{
  width:264px;flex:none;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
  border-right:1px solid var(--line);background:var(--bg2);padding:14px 10px 30px;
}
.side-head{margin:2px 6px 12px}
.side-continue{display:block;text-align:center;border:1px solid var(--acc);color:var(--acc);border-radius:9px;padding:7px;font-weight:600;font-size:13.5px}
.side-continue:hover{background:var(--acc-soft);text-decoration:none}
#nav-list{list-style:none;margin:0;padding:0}
#nav-list a{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;
  color:var(--tx2);font-size:13.5px;line-height:1.4;
}
#nav-list a:hover{background:var(--panel2);color:var(--tx);text-decoration:none}
#nav-list a.cur{background:var(--acc-soft);color:var(--acc);font-weight:600}
#nav-list .no{font-family:var(--mono);font-size:11px;color:var(--tx3);flex:none;width:22px;text-align:right}
#nav-list a.cur .no{color:var(--acc)}
#nav-list .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line2);margin-left:auto}
#nav-list .dot.visited{background:var(--cyan)}
#nav-list .dot.done{background:var(--green)}
.side-foot{margin-top:18px;padding:10px;border-top:1px dashed var(--line)}
.side-foot .src{font-size:11px;color:var(--tx3);line-height:1.6}

#main{flex:1;min-width:0;padding:26px 34px 40px;max-width:1060px;margin:0 auto}
#aside{
  width:280px;flex:none;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
  border-left:1px solid var(--line);padding:22px 16px 40px;background:var(--bg2);
  display:block;
}
#aside:empty{display:none}
.aside-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;margin-bottom:14px}
.aside-card h4{margin:0 0 8px;font-size:12px;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase}
.aside-card ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--tx2)}
.aside-card li{margin:3px 0}
.aside-card a{color:var(--tx2)}
.aside-card a:hover{color:var(--cyan)}

/* ---------- 章节头部 ---------- */
.ch-hero{margin-bottom:8px}
.ch-no{font-family:var(--mono);font-size:12px;color:var(--acc);letter-spacing:.12em;text-transform:uppercase}
.ch-title{font-size:30px;line-height:1.25;margin:4px 0 6px;font-weight:750}
.ch-tag{color:var(--tx2);font-size:15px;margin:0 0 10px}
.goal-card{border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:var(--r);background:var(--panel);padding:14px 18px;margin:14px 0}
.goal-card h3{margin:0 0 8px;font-size:14px;color:var(--cyan)}
.goal-card ul{margin:0;padding-left:4px;list-style:none}
.goal-card li{padding:2.5px 0 2.5px 26px;position:relative;font-size:14px}
.goal-card li::before{content:"□";position:absolute;left:2px;color:var(--cyan);font-size:15px}
.prereq-banner{border:1px dashed var(--amber);background:var(--amber-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;font-size:13.5px}
.prereq-banner b{color:var(--amber)}
.prereq-banner a{margin-right:10px}

/* ---------- 内容块 ---------- */
#content{font-size:15px}
#content h2{font-size:21px;margin:34px 0 10px;padding-top:10px;font-weight:700;border-top:1px solid var(--line)}
#content h2:first-child{border-top:none;margin-top:18px}
#content h3{font-size:16.5px;margin:22px 0 8px;font-weight:650}
.lead{
  border:1px solid var(--cyan);border-left-width:4px;border-radius:var(--r);
  background:var(--cyan-soft);padding:12px 16px;margin:12px 0;font-size:15.5px;
}
.lead .lg-tag{font-size:11px;color:var(--cyan);letter-spacing:.1em;display:block;margin-bottom:2px}
.layers{display:flex;flex-direction:column;gap:0;margin:14px 0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.layer{padding:12px 16px;border-bottom:1px dashed var(--line)}
.layer:last-child{border-bottom:none}
.layer .ly-tag{font-size:11px;letter-spacing:.08em;font-weight:700;display:inline-block;border-radius:20px;padding:1px 10px;margin-bottom:4px}
.layer.l1{background:var(--cyan-soft)} .layer.l1 .ly-tag{color:var(--cyan);border:1px solid var(--cyan)}
.layer.l2{background:var(--panel)}   .layer.l2 .ly-tag{color:var(--blue);border:1px solid var(--blue)}
.layer.l3{background:var(--panel2)}  .layer.l3 .ly-tag{color:var(--purple);border:1px solid var(--purple)}
.layer p{margin:.2em 0}
.layer ul{margin:.3em 0;padding-left:20px}
.layer li{margin:2px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:13px 15px}
.card h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card p{margin:0;font-size:13.5px;color:var(--tx2);line-height:1.7}
.badge{font-size:10.5px;font-family:var(--mono);border-radius:20px;padding:1px 8px;letter-spacing:.04em;flex:none}
.badge.concept{color:var(--cyan);border:1px solid var(--cyan);background:var(--cyan-soft)}
.badge.protocol{color:var(--blue);border:1px solid var(--blue);background:var(--blue-soft)}
.badge.impl{color:var(--purple);border:1px solid var(--purple);background:var(--purple-soft)}
.badge.eng{color:var(--green);border:1px solid var(--green);background:var(--green-soft)}
.note{border-radius:var(--r);padding:11px 15px;margin:13px 0;font-size:13.8px;border:1px solid var(--line);border-left-width:4px}
.note > b{display:flex;align-items:center;gap:7px;margin-bottom:3px;font-size:13px}
.note p b{display:inline}
.note p{margin:.15em 0}
.note.info{border-left-color:var(--cyan);background:var(--cyan-soft)} .note.info b{color:var(--cyan)}
.note.warn{border-left-color:var(--acc);background:var(--acc-soft)} .note.warn b{color:var(--acc)}
.note.why{border-left-color:var(--blue);background:var(--blue-soft)} .note.why b{color:var(--blue)}
.note.protocol{border-left-color:var(--purple);background:var(--purple-soft)} .note.protocol b{color:var(--purple)}
.note.eng{border-left-color:var(--green);background:var(--green-soft)} .note.eng b{color:var(--green)}
.note.misconception{border-left-color:var(--amber);background:var(--amber-soft)} .note.misconception b{color:var(--amber)}
.extend{border:1px dashed var(--amber);border-radius:var(--r);margin:14px 0;background:var(--amber-soft)}
.extend summary{cursor:pointer;padding:10px 15px;font-size:13.5px;font-weight:650;color:var(--amber);list-style:none}
.extend summary::before{content:"▸ 扩展知识 · ";font-size:12px}
.extend[open] summary::before{content:"▾ 扩展知识 · "}
.extend .ex-body{padding:0 16px 12px;font-size:13.5px;color:var(--tx2)}
.extend .ex-body h4{color:var(--tx);margin:10px 0 4px;font-size:13.5px}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
.tbl th{background:var(--panel2);text-align:left;font-weight:650}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;line-height:1.6}
.tbl td .mono,.mono{font-family:var(--mono);font-size:.92em}
.tbl-wrap{overflow-x:auto;margin:14px 0}
.tbl-wrap .tbl{margin:0}
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.8px;line-height:1.65;margin:14px 0}
pre.code .c{color:var(--tx3)} pre.code .k{color:var(--acc)} pre.code .s{color:var(--green)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:13px 0}
.kv .kv-i{border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;background:var(--panel)}
.kv .kv-k{font-size:11.5px;color:var(--tx3);display:block}
.kv .kv-v{font-family:var(--mono);font-size:14.5px;color:var(--cyan);font-weight:600}
.diagram{border:1px solid var(--line);border-radius:var(--r2);background:var(--canvas);padding:10px;margin:14px 0;overflow-x:auto}
.diagram svg{display:block;min-width:520px;width:100%}
.diagram .cap{font-size:12px;color:var(--tx3);text-align:center;padding:4px 6px 2px}
.mis-list{margin:12px 0;display:flex;flex-direction:column;gap:9px}
.mis{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mis .mq{padding:9px 14px;font-size:13.5px;background:var(--amber-soft);color:var(--amber);font-weight:600}
.mis .ma{padding:9px 14px;font-size:13.5px;color:var(--tx2);border-top:1px solid var(--line)}
.mis .ma b{color:var(--green)}

/* 术语 tooltip */
.term{border-bottom:1px dotted var(--cyan);cursor:help;color:var(--tx)}
#tooltip{
  position:fixed;z-index:100;max-width:300px;background:var(--panel);border:1px solid var(--line2);
  border-radius:9px;box-shadow:var(--shadow);padding:9px 12px;font-size:12.5px;color:var(--tx2);pointer-events:none;line-height:1.6;
}
#tooltip b{color:var(--cyan);display:block;font-size:12px}

/* ---------- 实验区 ---------- */
.exp{border:1px solid var(--line2);border-radius:var(--r2);margin:20px 0;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.exp-head{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.exp-head .exp-ico{width:24px;height:24px;border-radius:6px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.exp-head h3{margin:0;font-size:14.5px}
.exp-head .exp-sub{font-size:11.5px;color:var(--tx3);margin-left:auto;text-align:right}
.exp-body{padding:14px 16px}
.exp-canvas{background:var(--canvas);background-image:radial-gradient(rgba(122,144,190,.11) 1px, transparent 1px);background-size:22px 22px;border:1px solid var(--canvas-line);border-radius:var(--r);min-height:120px;position:relative;overflow:hidden}
.exp-controls{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ebtn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:5px 13px;font-size:13px;cursor:pointer}
.ebtn:hover{border-color:var(--cyan);color:var(--cyan)}
.ebtn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.ebtn.primary:hover{color:#fff;filter:brightness(1.1)}
.ebtn.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.exp-controls .spacer{flex:1}
.exp-log{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--code-bg);padding:9px 13px;font-family:var(--mono);font-size:12px;line-height:1.7;max-height:150px;overflow:auto;color:var(--tx2)}
.exp-log:empty{display:none}
.exp-log .em{color:var(--acc)} .exp-log .ok{color:var(--green)}
.exp-note{font-size:12.5px;color:var(--tx3);margin-top:8px}
input[type=range]{accent-color:var(--acc)}
select.ebtn,input.einput{height:30px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--tx);font-size:13px;padding:0 8px}
.exp-done{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:12px;font-family:var(--mono)}

/* 帧字段检查器 */
.fi-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media(max-width:820px){.fi-grid{grid-template-columns:1fr}}
.fi-frame{font-family:var(--mono);font-size:12px;line-height:1.5}
.fi-bytes{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--canvas-line);border-radius:8px;overflow:hidden;margin:6px 0}
.fi-f{padding:8px 6px;text-align:center;cursor:pointer;border-right:1px solid var(--canvas-line);flex-grow:1;min-width:34px}
.fi-f:last-child{border-right:none}
.fi-f small{display:block;font-size:10px;opacity:.85;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
.fi-f:hover{filter:brightness(1.25)}
.fi-f.sel{outline:2px solid var(--cyan);outline-offset:-2px;filter:brightness(1.2)}
.fi-info{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel2);font-size:13px;min-height:180px}
.fi-info h4{margin:0 0 6px;color:var(--cyan);font-family:var(--mono)}
.fi-info dl{margin:0;display:grid;grid-template-columns:64px 1fr;gap:3px 8px}
.fi-info dt{color:var(--tx3);font-size:12px}
.fi-info dd{margin:0;font-size:12.5px}

/* 动画元素 */
.ec-tx{fill:var(--canvas-tx);font-size:12px;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
.ec-tx.sm{font-size:10.5px}.ec-tx.big{font-size:14px;font-weight:600}
.ec-mono{font-family:var(--mono);font-size:10.5px}
.ec-box{fill:#182338;stroke:#3a4c72;rx:6}
.ec-md{fill:#22314e;stroke:#5b79b8}
.ec-hot{stroke:var(--acc)}
.ec-acc{fill:#e8442e}.ec-cyan{fill:#3fc1ce}.ec-grn{fill:#4cc07a}.ec-yl{fill:#e5b545}
.frame-pkt{filter:drop-shadow(0 0 6px rgba(232,68,46,.7))}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulsing{animation:pulse 1.2s infinite}

/* LED */
.led{display:inline-block;width:13px;height:13px;border-radius:50%;background:#333;border:1px solid rgba(0,0,0,.4);vertical-align:-2px;margin:0 3px}
.led.green{background:#2ecc71}.led.red{background:#e74c3c}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes flick{0%,24%{opacity:1}25%,100%{opacity:.15}}
@keyframes nflash{0%,4%{opacity:1}5%,100%{opacity:.12}}
.led.blink{animation:blink 0.8s step-end infinite}
.led.flick{animation:flick 0.2s linear infinite}
.led.n1{animation:nflash 1.6s step-end infinite}
.led.n2{animation:nflash 1.6s step-end infinite}
@keyframes n2pat{0%,8%{opacity:1}9%,49%{opacity:.12}50%,58%{opacity:1}59%,100%{opacity:.12}}
.led.n2{animation-name:n2pat}

/* 动画打磨：处理脉冲 / ESM 等待与拒绝 */
.proc-flash{animation:procPulse .6s ease-out}
@keyframes procPulse{0%{filter:brightness(1.9)}100%{filter:brightness(1)}}
.esm-pending rect{animation:esmWait .55s ease-in-out infinite}
@keyframes esmWait{0%,100%{opacity:1}50%{opacity:.35}}
.esm-bad rect{animation:esmBad .3s ease-in-out 2}
@keyframes esmBad{50%{stroke:#e74c3c;stroke-width:3}}

/* ESM 图 */
.esm-node{cursor:pointer}
.esm-node rect{fill:#182338;stroke:#5b79b8;stroke-width:1.5;rx:8}
.esm-node:hover rect{stroke:var(--cyan)}
.esm-node.cur rect{stroke:var(--acc);stroke-width:2.5;fill:#26202c}
.esm-node.err rect{stroke:#e74c3c}
.esm-edge{stroke:#41537a;stroke-width:1.6;fill:none}

.match-item.right{border-color:var(--green)} .match-item.wrong{border-color:var(--acc)}
.order-list{display:flex;flex-direction:column;gap:7px}

.vl-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:2.5px 0;color:var(--canvas-tx)}

.step-card{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0;background:var(--panel);font-size:13.5px}

<script>
/* EtherCAT 术语表（依据 ETG Compendium Abbreviations 与正文） */
window.ETC_GLOSSARY = [
 {id:'EDP', en:'EtherCAT Device Protocol', zh:'EtherCAT 设备协议', cat:'协议', d:'通常简称 EtherCAT。用于现场级实时通信的 EtherCAT 协议，ESC 只处理 Type=1 的 EDP 帧。'},
 {id:'EAP', en:'EtherCAT Automation Protocol', zh:'EtherCAT 自动化协议', cat:'协议', d:'工厂/产线级的控制器间通信协议，基于交换式以太网（MAC/IP 寻址、可无线），周期通常 ≥1ms。'},
 {id:'MDevice', en:'MainDevice', zh:'主站设备', cat:'架构', d:'控制 EtherCAT 通信、唯一能主动发送帧的设备（历史上称 Master），通常集成在 PLC/NC 控制器中。'},
 {id:'SubDevice', en:'SubordinateDevice / SubDevice', zh:'从站设备', cat:'架构', d:'被动处理帧的现场设备（历史上称 Slave），如传感器、执行器、驱动器。'},
 {id:'ESC', en:'EtherCAT SubDevice Controller', zh:'从站控制器', cat:'硬件', d:'实现全部数据链路层功能的硬件（ASIC/IP核/微码）：帧处理、自动转发/回环、FMMU、SyncManager、DC 单元、寄存器与 RAM。'},
 {id:'EPU', en:'EtherCAT Processing Unit', zh:'EtherCAT 处理单元', cat:'硬件', d:'ESC 内处理数据报的功能块：解码/执行读写、自动转发与回环、FMMU 映射、错误计数。'},
 {id:'FMMU', en:'Fieldbus Memory Management Unit', zh:'现场总线内存管理单元', cat:'硬件', d:'把逻辑地址（32 位逻辑地址空间）按位映射到从站物理内存的功能块，是实现单帧更新全网过程映像的关键。'},
 {id:'SM', en:'SyncManager', zh:'同步管理器', cat:'硬件', d:'保护 ESC 物理内存数据一致性的功能块。one-buffer 模式用于邮箱（握手），three-buffer 模式用于过程数据（随时读写最新值）。'},
 {id:'PDI', en:'Physical Device Interface', zh:'物理设备接口', cat:'硬件', d:'ESC 与本地应用（应用控制器或 I/O）之间的接口：数字 I/O、SPI、并行总线、FPGA 片内总线等，ESC 专属。'},
 {id:'MII', en:'Media Independent Interface', zh:'媒体独立接口', cat:'硬件', d:'PHY 与 MAC（EtherCAT 中为 ESC）之间的标准接口；另有 RMII/RGMII 变体。'},
 {id:'MDI', en:'Medium Dependent Interface', zh:'媒体相关接口', cat:'硬件', d:'PHY 与物理线缆（RJ45/M8/M12 等）之间的连接接口。'},
 {id:'PHY', en:'Physical layer device', zh:'物理层器件', cat:'硬件', d:'实现 100BASE-TX/FX 信号编解码的器件；EtherCAT 要求 RX 延时 <320ns、TX 延时 <140ns、link loss 反应 <15µs。'},
 {id:'SII', en:'SubDevice Information Interface', zh:'从站信息接口', cat:'配置', d:'ESI 的压缩版，通常存于 I²C EEPROM。包含 ESC 配置、设备身份（VPRS）、默认 mailbox/过程数据配置等；经 ESC 寄存器 0x0500–0x050F 的命令接口访问。'},
 {id:'ESI', en:'EtherCAT SubDevice Information', zh:'从站信息文件', cat:'配置', d:'描述从站 EtherCAT 特性的 XML 设备描述文件（电子数据表），提供给配置工具生成网络配置。'},
 {id:'ENI', en:'EtherCAT Network Information', zh:'网络信息文件', cat:'配置', d:'配置工具输出的标准化网络描述（含初始化命令与周期命令列表），交给 MainDevice 执行。'},
 {id:'ESM', en:'EtherCAT State Machine', zh:'EtherCAT 状态机', cat:'协议', d:'协调主站与从站启动与运行的五种状态：INIT/PREOP/SAFEOP/OP/BOOT；每状态定义可用功能集。'},
 {id:'CoE', en:'CAN application protocol over EtherCAT', zh:'基于 CANopen 的应用协议', cat:'协议', d:'最常用的邮箱应用协议，基于 CANopen DS301（EN 50325-4）：对象字典、SDO 读写参数、PDO 映射描述、诊断。'},
 {id:'FoE', en:'File Access over EtherCAT', zh:'文件访问协议', cat:'协议', d:'TFTP 式的文件传输协议（WRQ/RRQ/DATA/ACK/ERROR/BUSY），典型用于 BOOT 态固件下载，资源占用极小。'},
 {id:'EoE', en:'Ethernet over EtherCAT', zh:'以太网隧道协议', cat:'协议', d:'把标准以太网帧分片后经邮箱隧道传输，在段内实现虚拟交换/路由，不影响实时过程数据通信。'},
 {id:'AoE', en:'ADS over EtherCAT', zh:'ADS 路由协议', cat:'协议', d:'支持跨段路由（NetID/Port）、服务并行化（InvokeID），并可承载 CoE/FoE 等其他邮箱协议。'},
 {id:'SoE', en:'Servo drive profile over EtherCAT', zh:'伺服驱动协议', cat:'协议', d:'映射 SERCOS 伺服行规（IDN 参数、AT/MDT）到 EtherCAT 的协议，IEC 61800-7。'},
 {id:'VoE', en:'Vendor specific profile over EtherCAT', zh:'厂商专用协议', cat:'协议', d:'以 Vendor ID + Vendor Type 标识的厂商自定义邮箱协议。'},
 {id:'FSoE', en:'Safety over EtherCAT', zh:'安全协议', cat:'协议', d:'功能安全数据传输协议（黑色通道方案），本版 Compendium 仅提及未展开。'},
 {id:'PDO', en:'Process Data Object', zh:'过程数据对象', cat:'数据', d:'周期性交换过程数据的容器；由 PDO 映射对象（0x1600+/0x1A00+）列出内容，PDO 分配对象（0x1C12/0x1C13）决定哪些 PDO 被传输。'},
 {id:'RxPDO', en:'Receive PDO', zh:'输出过程数据', cat:'数据', d:'MainDevice→SubDevice 方向的 PDO（输出），由 SM2 承载，映射对象 0x1600–0x17FF。'},
 {id:'TxPDO', en:'Transmit PDO', zh:'输入过程数据', cat:'数据', d:'SubDevice→MainDevice 方向的 PDO（输入），由 SM3 承载，映射对象 0x1A00–0x1BFF。'},
 {id:'SDO', en:'Service Data Object', zh:'服务数据对象', cat:'协议', d:'CoE 中非周期、带确认的参数访问服务：Upload（读）/Download（写），分 expedited(≤8B)/normal/segmented，另有 SDO Info 与 Abort。'},
 {id:'OD', en:'Object Dictionary', zh:'对象字典', cat:'数据', d:'CoE 参数模型：16 位索引 + 8 位子索引寻址；对象分 VAR/ARRAY/RECORD；索引分区：数据类型/通信 0x1000+/厂商 0x2000+/行规 0x6000+。'},
 {id:'WKC', en:'Working Counter', zh:'工作计数器', cat:'协议', d:'每个数据报末尾的 16 位计数器：成功读 +1、成功写 +1、读写 +3；与期望值比对即可周期性确认全网读写一致性，是最重要的实时诊断特征之一。'},
 {id:'DC', en:'Distributed Clocks', zh:'分布式时钟', cat:'同步', d:'在段内建立并维持公共时基（System time）的机制；同步性 <<1µs；支持 SYNC0/SYNC1 事件输出与 LATCH 时间戳输入。'},
 {id:'Sync0', en:'SYNC0 event', zh:'SYNC0 事件', cat:'同步', d:'ESC 基于系统时间产生的周期/单次硬件输出事件，用于在精确时刻触发应用（如 ADC 采样、PWM 更新）。'},
 {id:'SyncUnit', en:'SyncUnit', zh:'同步单元', cat:'概念', d:'同一逻辑命令承载的数据集合，构成独立的一致性/时序上下文（如 NC 250µs 与 PLC 1ms 分帧传输）。'},
 {id:'LRW', en:'Logical Read Write', zh:'逻辑读写命令', cat:'协议', d:'命令码 0x0C：按逻辑地址同时读输入并写输出，是周期过程数据最常用的命令。'},
 {id:'APRD', en:'Auto increment Physical Read', zh:'自增物理读', cat:'协议', d:'命令码 0x01：每个 ESC 将地址位置字段 +1，收到值为 0 的从站即被寻址；用于扫描与无地址启动。'},
 {id:'FPRD', en:'Configured address Physical Read', zh:'节点寻址读', cat:'协议', d:'命令码 0x04：按 Configured Station Address（0x0010）寻址读。'},
 {id:'ARMW', en:'Auto increment Read Multiple Write', zh:'自增多写', cat:'协议', d:'命令码 0x0D：命中的从站读出数据，其后所有从站把该数据写入同地址；FRMW 的自增版本，DC 系统时间分发用它。'},
 {id:'FRMW', en:'Configured address Read Multiple Write', zh:'节点寻址多写', cat:'协议', d:'命令码 0x0E：参考时钟读出 System time，其余 DC 从站写入自身 0x0910 并调整速率，维持时钟同步。'},
 {id:'BRD', en:'Broadcast Read', zh:'广播读', cat:'协议', d:'命令码 0x07：所有从站做逻辑 OR 汇聚读数据；常用于读全网 AL Status 或 DC 偏差。'},
 {id:'BWR', en:'Broadcast Write', zh:'广播写', cat:'协议', d:'命令码 0x08：写入所有从站同一地址；DC 延时测量即用 BWR 打时间戳。'},
 {id:'AL', en:'Application Layer', zh:'应用层', cat:'架构', d:'IEC 61158-5/-6 定义的层级：ESM、邮箱协议、过程数据处理，运行在应用控制器的通信栈中。'},
 {id:'DLL', en:'Data Link Layer', zh:'数据链路层', cat:'架构', d:'IEC 61158-3/-4 定义：帧格式、processing on the fly、端口转发；全部由 ESC 硬件实现。'},
 {id:'PhL', en:'Physical Layer', zh:'物理层', cat:'架构', d:'IEEE 802.3（以太网）物理层：PHY、MII/MDI、100BASE-TX/FX、EtherCAT P 供电选项。'},
 {id:'ALC', en:'AL Control (0x0120)', zh:'AL 控制寄存器', cat:'寄存器', d:'主站写此寄存器请求状态迁移或错误确认（bit4 Error Ack，bit5 ID Request）；从站只读。'},
 {id:'ALS', en:'AL Status (0x0130)', zh:'AL 状态寄存器', cat:'寄存器', d:'从站写：当前 ESM 状态码（1/2/4/8/3）+ bit4 Error Indication；主站只读。'},
 {id:'ALSC', en:'AL Status Code (0x0134)', zh:'AL 状态码', cat:'寄存器', d:'从站报错时提供的错误原因码，如 0x0016 邮箱配置无效、0x001B 看门狗、0x0032 PLL 错误。'},
 {id:'CSA', en:'Configured Station Address (0x0010)', zh:'配置站址', cat:'寄存器', d:'主站在启动时分配的 16 位节点地址（易失），FPRD/FPWR/FPRW 用它寻址。'},
 {id:'Alias', en:'Configured Station Alias (0x0012)', zh:'站址别名', cat:'配置', d:'非易失存储在 SII word 0x0004 的 16 位 ID，上电加载到寄存器 0x0012；显式设备标识的通用机制。'},
 {id:'VPRS', en:'Vendor ID / Product Code / Revision / Serial', zh:'设备身份四元组', cat:'配置', d:'设备身份：Vendor ID、Product Code、Revision Number、Serial Number；位于 SII、CoE 0x1018 与 ESI Identity。'},
 {id:'InitCmd', en:'Init commands', zh:'初始化命令', cat:'概念', d:'启动期间配置 ESC 寄存器的 DL 命令（如写 SM/FMMU/DC 寄存器），与经邮箱下载的 start-up commands 相对。'},

E['addressing'] = { mount: function (slot, ctx) {
  var sh = shell(slot);
  var mode = 'APRD', target = 3, broken = false;
  var svg = S('svg', { viewBox: '0 0 880 250', width: '100%' }, sh.canvas);
  var xs = [80, 300, 520, 740];
  var groups = [];
  xs.forEach(function (x, i) {
    var g = S('g', {}, svg);
    S('rect', { x: x - 60, y: 90, width: 120, height: 70, rx: 8, fill: '#182338', stroke: '#3a4c72', 'stroke-width': 1.6 }, g);
    txt(x, 118, 'SubDevice ' + (i + 1), 'ec-tx', g);
    var adp = txt(x, 145, '—', 'ec-mono', g); adp.setAttribute('fill', '#e5b545');
    groups.push({ g: g, adp: adp });
    if (i < 3) groups[i].link = S('line', { x1: x + 60, y1: 125, x2: xs[i + 1] - 60, y2: 125, stroke: '#3a4c72', 'stroke-width': 2.5 }, svg);
  });
  txt(80, 60, 'MainDevice', 'ec-tx', svg);
  S('rect', { x: 20, y: 70, width: 120, height: 40, rx: 8, fill: '#22314e', stroke: '#5b79b8' }, svg);
  txt(80, 95, 'MainDevice', 'ec-tx', svg);
  var pkt = S('g', { opacity: 0 }, svg);
  S('rect', { x: -30, y: -12, width: 60, height: 24, rx: 5, fill: '#e8442e' }, pkt);
  var pktT = txt(0, 4, 'APRD', 'ec-tx sm', pkt); pktT.setAttribute('fill', '#fff'); pktT.style.fontWeight = '700';
  function setP(x, y, t) { pkt.setAttribute('transform', 'translate(' + x + ',' + y + ')'); if (t) pktT.textContent = t; }
  /* 控制区 */
  var modeSel = document.createElement('select'); modeSel.className = 'einput';
  [['APRD', 'APRD · 自增寻址（位置）'], ['FPRD', 'FPRD · 节点寻址（固定站址）'], ['LRD', 'LRD · 逻辑寻址（FMMU）']].forEach(function (m) {
    var o = document.createElement('option'); o.value = m[0]; o.textContent = m[1]; modeSel.appendChild(o);
  });
  sh.controls.appendChild(modeSel);
  var tgt = document.createElement('select'); tgt.className = 'einput';
  for (var i = 1; i <= 4; i++) { var o = document.createElement('option'); o.value = i; o.textContent = '目标：SubDevice ' + i; tgt.appendChild(o); }
  sh.controls.appendChild(tgt);
  tgt.value = 3;
  var brk = btn(sh.controls, '☑ 断缆模拟（S3–S4 之间）', function () {
    broken = !broken; brk.classList.toggle('on', broken);
    groups[2].link.setAttribute('stroke', broken ? '#e74c3c' : '#3a4c72');
    groups[2].link.setAttribute('stroke-dasharray', broken ? '4 4' : 'none');
    groups[3].g.setAttribute('opacity', broken ? 0.25 : 1);
    logLine(sh.log, broken ? '<span class="em">S3–S4 间电缆断开：SubDevice 4 从拓扑中消失</span>' : '链路恢复');
    draw();
  });
  spacer(sh.controls);
  var runBtn = btn(sh.controls, '发送数据报 ▶', run, 'primary');
  function reset() {
    groups.forEach(function (g2) { g2.adp.textContent = '—'; g2.g.childNodes[0].setAttribute('stroke', '#3a4c72'); });
    pkt.setAttribute('opacity', 0);
  }
  function draw() { reset(); }
  modeSel.addEventListener('change', function () { mode = modeSel.value; draw(); });
  tgt.addEventListener('change', function () { target = +tgt.value; });
  function run() {
    ctx.done(); reset();
    if (broken && target === 4) logLine(sh.log, '<span class="em">注意：SubDevice 4 已断开，本次数据报不会再到达它 —— WKC 将不满足期望！</span>');
    var addrLabel = mode === 'APRD' ? 'ADP ' + hex(0x10000 - target + 0, 4).replace(/^/, '') : mode === 'FPRD' ? 'Node 100' + target : 'LogAddr';
    if (mode === 'APRD') {
      var start = (target - 2) & 0xFFFF;
      pktT.textContent = 'APRD ' + hex(start, 4);
      var cur = start, x = 80, stops = Math.min(target, 3);
      pkt.setAttribute('opacity', 1); setP(80, 40);
      var k = 0;
      function hop() {
        if (k >= stops) { setP(xs[stops - 1], 40); pkt.setAttribute('opacity', 0); return; }
        k++;
        (function (idx) {
          tween(420, function (p) { setP(lerp(idx === 0 ? 80 : xs[idx - 1], xs[idx], p), 40); }, function () {
            var arrive = cur; cur = (cur + 1) & 0xFFFF;
            groups[idx].adp.textContent = '收到 ' + hex(arrive, 4) + (arrive === 0 ? ' ←命中!' : ' →自增');
            groups[idx].g.childNodes[0].setAttribute('stroke', arrive === 0 ? '#ff5a3c' : '#3a4c72');
            logLine(sh.log, 'SubDevice ' + (idx + 1) + '：收到位置值 <b class="mono">' + hex(arrive, 4) + '</b>' +
              (arrive === 0 ? ' → <span class="ok">就是它！执行读取，之后自增为 ' + hex(cur, 4) + '</span>' : ' → 不是目标，位置 +1 后转发'));
            hop();
          });
        })(k - 1);
      }
      hop();
    } else if (mode === 'FPRD') {
      pktT.textContent = 'FPRD ' + hex(0x03E8 + target, 4);
      pkt.setAttribute('opacity', 1); setP(80, 40);
      var j = 0;
      (function pass() {
        if (j >= 3) { pkt.setAttribute('opacity', 0); return; }
        tween(380, function (p) { setP(lerp(j === 0 ? 80 : xs[j - 1], xs[j], p), 40); }, function () {
          var nodeAddr = 0x03E9 + j;
          groups[j].adp.textContent = '站址 ' + hex(nodeAddr, 4) + (nodeAddr === 0x03E8 + target ? ' ←匹配' : ' 不匹配');
          groups[j].g.childNodes[0].setAttribute('stroke', nodeAddr === 0x03E8 + target ? '#ff5a3c' : '#3a4c72');
          logLine(sh.log, 'SubDevice ' + (j + 1) + '：比较寄存器 0x0010（Configured Station Address = ' + hex(nodeAddr, 4) + '）与数据报地址 → ' +
            (nodeAddr === 0x03E8 + target ? '<span class="ok">匹配，执行读取</span>' : '不匹配，仅转发'));
          j++; pass();
        });
      })();
      logLine(sh.log, '节点寻址：MainDevice 启动时已用 APWR 写入各站固定地址（1001…1004），断电丢失，每次上电重新分配');
    } else {
      pktT.textContent = 'LRD';
      pkt.setAttribute('opacity', 1); setP(80, 40);
      groups.forEach(function (g2, gi) {
        g2.adp.textContent = 'FMMU 比对逻辑区间';
        g2.g.childNodes[0].setAttribute('stroke', '#3a4c72');
      });
      tween(900, function (p) { setP(lerp(80, 740, p), 40); }, function () { pkt.setAttribute('opacity', 0); });
      logLine(sh.log, '逻辑寻址：32 位地址作为<b>整体</b>使用（4GB 逻辑空间），每个 SubDevice 的 FMMU 检查该区间是否与自己配置的映射区重叠 → 命中才读写。详见 S9 的 FMMU 模拟器');
    }
  }
  draw();
  logLine(sh.log, '选择寻址模式并点击「发送数据报」。自增寻址无需任何配置即可访问任意 SubDevice —— 这是 EtherCAT「免配置即地址」的核心。');
}};

  var devBox = sh.querySelector('#vl-devs'), stepBox = sh.querySelector('#vl-steps'), pdBox = sh.querySelector('#vl-pd');
  var fl = sh.querySelector('#vl-faults');
  function stateChip(d) { return '<span class="st ' + d.st.replace('-', '') + '">' + d.st.toUpperCase() + '</span>'; }
  function drawDevs() {

      var r = el('div', 'vl-dev', '<span>' + d.n + '</span>' + stateChip(d) + (fault === 'link' && i === 1 ? ' <span style="color:#ff5a3c">⚡断</span>' : ''));

  var stepActions = [

    function () { logLine(slotLog, 'SM2/SM3（三缓冲）+ FMMU 逻辑映射配置完成；逻辑过程映像布局：输出 21 B + 输入 14 B。'); },
    function () { logLine(slotLog, 'BWR/APRD 测延时 → 写 0x0928；偏置写 0x0920；~15000×FRMW 静态漂移补偿 → 偏差 < 100 ns。'); },
    function () { logLine(slotLog, 'MainDevice 开始循环发送 LRW 周期帧。'); },
    function () { setStateAll('safeop'); logLine(slotLog, 'AL Control=4 → <b>SAFEOP</b>：输入有效（编码器/IO 实时），输出保持安全值。', 'ok'); },
    function () { setStateAll('op'); logLine(slotLog, 'DC 检查 + PLL 锁定 → AL Control=8 → <b>OP</b>：输出激活，全网受控运行。', 'ok'); },
    function () {
      logLine(slotLog, '进入运行态：过程数据每周期刷新（LRW：读+1/写+2 语境）。伺服按目标位置运动。', 'ok');
      if (runTimer) clearInterval(runTimer);
      runTimer = setInterval(function () {
        if (!document.contains(sh)) { clearInterval(runTimer); return; }
        cyc++;
        DEV.forEach(function (d) {
          if (d.t === 'drv' && (d.st === 'op')) { d.pd.tgt = fault === 'wd' ? 0 : (600 + Math.round(Math.sin(cyc / 9) * 400)); d.pd.pos = fault === 'wd' ? 0 : d.pd.tgt - 3 + Math.round(Math.random() * 6); d.pd.cv = fault === 'wd' ? 0 : d.pd.tgt - d.pd.pos; }
          if (d.t === 'enc' && (d.st === 'op' || d.st === 'safeop')) d.pd.pos = (d.pd.pos + 7) % 100000;
          if (d.t === 'io' && d.st === 'op') d.pd.inp = fault === 'wd' ? 0 : (cyc % 4 === 0 ? 0x0F : 0x05);

  var ctrl = el('div', 'exp-controls'); slot.insertBefore(ctrl, sh);
  btn(ctrl, '执行下一步 ▸', function () {
    ctx.done();
    if (step >= STEP_NAMES.length - 1) { logLine(slotLog, '已在运行态。可注入故障体验诊断，或重置重来。'); return; }
    step++; stepActions[step](); draw();
  }, 'primary');
  btn(ctrl, '⏩ 一键到 OP', function () {
    ctx.done();
    var iv = setInterval(function () {
      if (!document.contains(sh)) { clearInterval(iv); return; } /* 卸载防护（P2-6） */
      if (step >= STEP_NAMES.length - 1) { clearInterval(iv); return; }
      step++; stepActions[step](); draw();

  });
  btn(ctrl, '↺ 重置', function () {

    slotLog.innerHTML = ''; draw();

  [['link', '断缆 数字I/O–Servo1'], ['wd', '伺服看门狗'], ['dc', 'DC 失步']].forEach(function (f) {
    var b = btn(fl, f[1], function () {

<script>
/* ============================================================
   EtherCAT 交互学习系统 — app.js（框架）
   路由 / 渲染 / 术语提示 / Quiz 引擎 / 搜索 / 进度 / 主题
   ============================================================ */
(function () {
'use strict';

/* ---------- 工具 ---------- */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2200);
}
function debounce(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; }

/* ---------- 数据 ---------- */
var CH = (window.ETC_CHAPTERS || []).slice().sort(function (a, b) { return a.num - b.num; });
var GL = window.ETC_GLOSSARY || [];
var GLMAP = {};
GL.forEach(function (g) { GLMAP[g.id] = g; });

/* ---------- 进度 ---------- */
var PKEY = 'etc_progress_v1';
var PROG = { chapters: {}, last: null, theme: null };
try {
  var raw = localStorage.getItem(PKEY);
  if (raw) { var p = JSON.parse(raw); if (p && typeof p === 'object') { PROG.chapters = p.chapters || {}; PROG.last = p.last || null; PROG.theme = p.theme || null; } }
} catch (e) { /* file:// 下 localStorage 可能被禁用，忽略 */ }
function saveProg() { try { localStorage.setItem(PKEY, JSON.stringify(PROG)); } catch (e) {} }
function chProg(id) { if (!PROG.chapters[id]) PROG.chapters[id] = { visited: false, done: false, quiz: null, experiments: [] }; return PROG.chapters[id]; }

/* ---------- 主题 ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#btn-theme').textContent = t === 'dark' ? '🌙' : '☀️';
  PROG.theme = t; saveProg();
  $$('.exp-canvas, .diagram').forEach(function () {}); // CSS 变量自动生效
}
applyTheme(PROG.theme || 'dark');
$('#btn-theme').addEventListener('click', function () {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ---------- 块渲染 ---------- */
function badge(b) { return b ? '<span class="badge ' + b + '">' + ({ concept: '概念', protocol: '协议', impl: '实现', eng: '工程' }[b] || b) + '</span>' : ''; }
function renderBlock(bk) {
  switch (bk.t) {
    case 'h2': return '<h2' + (bk.id ? ' id="' + bk.id + '"' : '') + '>' + bk.x + '</h2>';
    case 'h3': return '<h3>' + bk.x + '</h3>';
    case 'p': return '<p>' + bk.x + '</p>';
    case 'lead': return '<div class="lead"><span class="lg-tag">一句话理解</span>' + bk.x + '</div>';
    case 'layers': return '<div class="layers">' +
      '<div class="layer l1"><span class="ly-tag">第一层 · 一句话理解</span><p>' + bk.l1 + '</p></div>' +
      '<div class="layer l2"><span class="ly-tag">第二层 · 工作原理</span>' + bk.l2 + '</div>' +
      '<div class="layer l3"><span class="ly-tag">第三层 · 协议 / 工程细节</span>' + bk.l3 + '</div></div>';
    case 'note': return '<div class="note ' + (bk.kind || 'info') + '"><b>' + bk.h + '</b>' + (bk.x || '') + '</div>';
    case 'extend': return '<details class="extend"><summary>' + esc(bk.title || '') + '</summary><div class="ex-body">' + bk.x + '</div></details>';
    case 'cards': return '<div class="cards">' + bk.items.map(function (c) {
        return '<div class="card"><h4>' + (c.h || '') + badge(c.badge) + '</h4><p>' + (c.x || '') + '</p></div>';
      }).join('') + '</div>';
    case 'table': return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        bk.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
        bk.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>';
    case 'kv': return '<div class="kv">' + bk.items.map(function (i) {
        return '<div class="kv-i"><span class="kv-k">' + i[0] + '</span><span class="kv-v">' + i[1] + '</span></div>';
      }).join('') + '</div>';
    case 'diagram': return '<div class="diagram">' + bk.x + (bk.cap ? '<div class="cap">' + bk.cap + '</div>' : '') + '</div>';
    case 'exp': return '<section class="exp" data-exp="' + bk.id + '"><div class="exp-head"><span class="exp-ico">⚙</span><h3>' + bk.title + '</h3><span class="exp-sub">' + (bk.sub || '交互实验') + '</span></div><div class="exp-body" data-exp-body="' + bk.id + '"></div></section>';
    case 'code': return '<pre class="code">' + bk.x + '</pre>';
    case 'mis': return '<div class="mis-list">' + bk.items.map(function (m) {
        return '<div class="mis"><div class="mq">✕ ' + m.w + '</div><div class="ma"><b>✓ 正确理解：</b>' + m.r + '</div></div>';
      }).join('') + '</div>';
    case 'checklist': return '<div class="goal-card"><h3>学习完成后，我能够：</h3><ul>' +
        bk.items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul></div>';
    case 'steps': return bk.items.map(function (s, i) {
        return '<div class="step-card"><span class="sc-no">STEP ' + (i + 1) + '</span><br>' + s + '</div>';
      }).join('');
    default: return '';
  }
}

/* ---------- 术语标注 ---------- */
var termPatterns = GL.map(function (g) {
  return { g: g, re: new RegExp('\\b' + g.id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b') };
});
function annotateTerms(root, chapterId) {
  var used = [];
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      var p = n.parentNode;
      while (p && p !== root) {
        var tn = p.nodeName;
        if (tn === 'SCRIPT' || tn === 'STYLE' || tn === 'PRE' || tn === 'CODE' || tn === 'SVG' || tn === 'text' || (p.classList && (p.classList.contains('term') || p.classList.contains('exp')))) return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = [], n;
  while ((n = walker.nextNode())) nodes.push(n);
  var annotated = {};
  nodes.forEach(function (node) {
    var txt = node.nodeValue, hits = [];
    termPatterns.forEach(function (tp) {
      if (annotated[tp.g.id]) return;
      var m = tp.re.exec(txt);
      if (m) hits.push({ i: m.index, len: tp.g.id.length, g: tp.g });
    });
    if (!hits.length) return;
    hits.sort(function (a, b) { return a.i - b.i; });
    var frag = document.createDocumentFragment(), pos = 0;
    hits.forEach(function (h) {
      if (h.i < pos) return;
      frag.appendChild(document.createTextNode(txt.slice(pos, h.i)));
      var s = document.createElement('span');
      s.className = 'term'; s.textContent = txt.substr(h.i, h.len); s.dataset.term = h.g.id;
      frag.appendChild(s);
      annotated[h.g.id] = true; used.push(h.g.id);
      pos = h.i + h.len;
    });
    frag.appendChild(document.createTextNode(txt.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
  return used;
}

/* ---------- Quiz 引擎 ---------- */
function renderQuiz(quiz, chId, mount) {
  if (!quiz || !quiz.length) return;
  var wrap = el('section', 'quiz');
  wrap.innerHTML = '<div class="quiz-head"><span class="exp-ico" style="background:var(--cyan)">✓</span><h3>本章 Quiz（' + quiz.length + ' 题）</h3><span class="q-score"></span></div>';
  var answered = 0, correct = 0, total = quiz.length;
  var scoreEl = $('.q-score', wrap);
  /* 键盘可达性：选项/连线项可 Tab 聚焦，Enter/Space 触发（P3-8） */
  function kb(d) { d.tabIndex = 0; d.setAttribute('role', 'button'); d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.click(); } }); return d; }
  function updScore() { scoreEl.textContent = answered + '/' + total + ' · 正确 ' + correct; }

  quiz.forEach(function (q, qi) {
    var box = el('div', 'q-item');
    var typeName = { single: '单选', multi: '多选', judge: '判断', order: '排序', match: '连线', scenario: '场景分析' }[q.type] || '单选';
    box.innerHTML = '<div class="q-type">Q' + (qi + 1) + ' · ' + typeName + '</div><div class="q-text">' + q.q + '</div>';
    var area = el('div'), expBox = el('div', 'q-exp');
    expBox.style.display = 'none';
    box.appendChild(area); box.appendChild(expBox); wrap.appendChild(box);
    var judged = false;
    function isCorrect(sel) {
      if (q.type === 'multi') { var a = q.a.slice().sort().join(','); var s = sel.slice().sort().join(','); return a === s; }
      return sel === q.a;
    }
    function judge(sel, right, build) {
      if (judged) return; judged = true; answered++; if (right) correct++;
      updScore();
      expBox.style.display = '';
      expBox.innerHTML = (right ? '<span class="qe-ok">✓ 回答正确</span>' : '<span style="color:var(--acc)">✗ 回答错误</span>') +
        '<div style="margin-top:4px"><b>解析：</b>' + q.why + '</div>' +
        (q.rel ? '<div>' + q.rel.map(function (r) { var c = CH.find(function (x) { return x.id === r; }); return c ? '<a href="#/ch/' + r + '">→ ' + esc(c.title) + '</a>' : ''; }).join('') + '</div>' : '');
      if (answered === total) {
        var pct = Math.round(correct / total * 100);
        var pr = chProg(chId);
        pr.quiz = pr.quiz || { best: 0, attempts: 0 };
        pr.quiz.attempts++; pr.quiz.best = Math.max(pr.quiz.best, pct); saveProg();
        toast('本章 Quiz 完成：' + pct + '%（最高 ' + pr.quiz.best + '%）');
        refreshSidebar(); refreshProgress();
        if (!scoreEl.querySelector('.q-redo')) {
          var rb = el('button', 'ebtn q-redo', '↺ 重做本章 Quiz');
          rb.style.cssText = 'margin-left:10px;font-size:12px;padding:2px 10px';
          rb.addEventListener('click', function () { mount.innerHTML = ''; renderQuiz(quiz, chId, mount); });
          scoreEl.appendChild(rb);
        }
      }
      if (build) build();
    }
    var i, opts;
    if (q.type === 'multi') {
      var sel = [];
      opts = q.opts.map(function (o, oi) {
        var d = kb(el('div', 'q-opt', '<span class="qm">' + String.fromCharCode(65 + oi) + '</span><span>' + o + '</span>'));
        d.addEventListener('click', function () {
          if (judged) return;
          var ix = sel.indexOf(oi);
          if (ix >= 0) { sel.splice(ix, 1); d.classList.remove('sel'); }
          else { sel.push(oi); d.classList.add('sel'); }
        });
        area.appendChild(d); return d;
      });
      var btn = el('button', 'ebtn primary q-btn', '提交');
      btn.addEventListener('click', function () {
        if (judged || !sel.length) return;
        var right = isCorrect(sel);
        opts.forEach(function (d, oi) {
          if (q.a.indexOf(oi) >= 0) d.classList.add('right');
          else if (sel.indexOf(oi) >= 0) d.classList.add('wrong');
        });
        judge(sel, right);
      });
      area.appendChild(btn);
    } else if (q.type === 'judge') {
      opts = [true, false].map(function (v, oi) {
        var d = kb(el('div', 'q-opt', '<span class="qm">' + (oi === 0 ? 'T' : 'F') + '</span><span>' + (oi === 0 ? '正确' : '错误') + '</span>'));
        d.addEventListener('click', function () {
          if (judged) return;
          var right = (v === q.a);
          d.classList.add(right ? 'right' : 'wrong');
          judge(v, right);
        });
        area.appendChild(d); return d;
      });
    } else if (q.type === 'order') {
      var cur = q.items.map(function (_, i2) { return i2; });
      var list = el('div', 'order-list');
      function drawOrder() {
        list.innerHTML = '';
        cur.forEach(function (itemIdx, pos) {
          var d = el('div', 'order-item', '<span class="on">' + (pos + 1) + '</span><span style="flex:1">' + q.items[itemIdx] + '</span>' +
            '<span style="display:flex;gap:4px;flex:none">' +
            '<button class="ebtn" style="padding:1px 8px;font-size:12px" data-mv="-1"' + (pos === 0 ? ' disabled' : '') + '>↑</button>' +
            '<button class="ebtn" style="padding:1px 8px;font-size:12px" data-mv="1"' + (pos === cur.length - 1 ? ' disabled' : '') + '>↓</button></span>');
          d.draggable = true; d.dataset.pos = pos;
          d.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', pos); d.classList.add('dragging'); });
          d.addEventListener('dragend', function () { d.classList.remove('dragging'); });
          d.addEventListener('dragover', function (e) { e.preventDefault(); d.classList.add('over'); });
          d.addEventListener('dragleave', function () { d.classList.remove('over'); });
          d.addEventListener('drop', function (e) {
            e.preventDefault(); d.classList.remove('over');
            var from = +e.dataTransfer.getData('text/plain'), to = pos;
            if (from === to) return;
            var mv = cur.splice(from, 1)[0]; cur.splice(to, 0, mv); drawOrder();
          });
          $$('button[data-mv]', d).forEach(function (b) {
            b.addEventListener('click', function (e) {
              e.stopPropagation();
              if (judged) return;
              var dir = +b.dataset.mv, to = pos + dir;
              if (to < 0 || to >= cur.length) return;
              var mv = cur.splice(pos, 1)[0]; cur.splice(to, 0, mv); drawOrder();
            });
          });
          list.appendChild(d);
        });
      }
      drawOrder(); area.appendChild(list);
      var chk = el('button', 'ebtn primary q-btn', '提交顺序');
      chk.addEventListener('click', function () {
        if (judged) return;
        var right = cur.every(function (v, i3) { return v === q.order[i3]; });
        judge(cur, right);
      });
      area.appendChild(chk);
    } else if (q.type === 'match') {
      var lefts = q.pairs.map(function (p2) { return p2[0]; });
      var rights = q.pairs.map(function (p2) { return p2[1]; }).slice().sort(function () { return Math.random() - 0.5; });
      var picked = null, paired = {};
      var grid = el('div', 'match-grid');
      var colL = el('div', 'match-col'), colR = el('div', 'match-col');
      function drawMatch() {
        colL.innerHTML = ''; colR.innerHTML = '';
        lefts.forEach(function (L, li) {
          var d = kb(el('div', 'match-item', esc(L) + (paired[li] != null ? ' <span class="mono" style="color:var(--cyan)">→ ' + esc(paired[li]) + '</span>' : '')));
          if (picked !== null && picked.k === 'L' && picked.i === li) d.classList.add('sel');
          d.addEventListener('click', function () { if (judged) return; picked = { k: 'L', i: li }; drawMatch(); });
          colL.appendChild(d);
        });
        rights.forEach(function (R, ri) {
          var usedBy = Object.keys(paired).find(function (k) { return paired[k] === R; });
          var d = kb(el('div', 'match-item', esc(R) + (usedBy != null ? ' <span class="mono" style="color:var(--cyan)">← ' + esc(lefts[usedBy]) + '</span>' : '')));
          if (picked !== null && picked.k === 'R' && picked.i === ri) d.classList.add('sel');
          d.addEventListener('click', function () {
            if (judged) return;
            if (picked && picked.k === 'L' && usedBy == null) { paired[picked.i] = R; picked = null; drawMatch(); }
            else { picked = { k: 'R', i: ri }; drawMatch(); }
          });
          colR.appendChild(d);
        });
      }
      drawMatch(); grid.appendChild(colL); grid.appendChild(colR); area.appendChild(grid);
      var mb = el('button', 'ebtn primary q-btn', '提交连线');
      mb.addEventListener('click', function () {
        if (judged) return;
        var right = q.pairs.every(function (p2, li) { return paired[li] === p2[1]; });
        judge(paired, right);
      });
      area.appendChild(mb);
    } else { /* single / scenario */
      opts = q.opts.map(function (o, oi) {
        var d = kb(el('div', 'q-opt', '<span class="qm">' + String.fromCharCode(65 + oi) + '</span><span>' + o + '</span>'));
        d.addEventListener('click', function () {
          if (judged) return;
          var right = (oi === q.a);
          d.classList.add(right ? 'right' : 'wrong');
          judge(oi, right);
        });
        area.appendChild(d); return d;
      });
    }
  });
  updScore();
  mount.appendChild(wrap);
}

/* ---------- 实验挂载 ---------- */
function mountExperiments(root, chId) {
  $$('[data-exp-body]', root).forEach(function (slot) {
    var id = slot.dataset.expBody;
    var comp = (window.ETC_EXPERIMENTS || {})[id] || (window.ETC_LABS || {})[id];
    if (!comp) { slot.innerHTML = '<p class="exp-note">实验组件缺失：' + esc(id) + '</p>'; return; }
    try {
      comp.mount(slot, {
        done: function (name) {
          var pr = chProg(chId);
          name = name || id;
          if (pr.experiments.indexOf(name) < 0) { pr.experiments.push(name); saveProg(); refreshSidebar(); }
        },
        log: function (box, msg, cls) {
          var l = box.querySelector('.exp-log');
          if (!l) return;
          var d = document.createElement('div');
          if (cls) d.className = cls;
          d.innerHTML = msg;
          l.appendChild(d); l.scrollTop = l.scrollHeight;
        }
      });
    } catch (e) {
      slot.innerHTML = '<p class="exp-note">实验初始化失败：' + esc(e.message) + '</p>';
      if (window.console) console.error('experiment ' + id, e);
    }
  });
}

var searchInput = $('#search'), drop = $('#search-drop'), selIdx = -1, results = [];

  results = INDEX.filter(function (r) { return (r.title + ' ' + r.sub).toLowerCase().indexOf(q) >= 0; }).slice(0, 12);
  selIdx = -1;
  if (!results.length) { drop.innerHTML = '<div class="sr-item"><b>无结果</b><span>试试 Frame、ESC、FMMU、WKC、CoE、DC、看门狗…</span></div>'; drop.hidden = false; return; }
  drop.innerHTML = '';
  var kinds = {};
  results.forEach(function (r) {
    if (!kinds[r.kind]) { kinds[r.kind] = el('div', 'sr-head', r.kind); drop.appendChild(kinds[r.kind]); }
    var d = el('a', 'sr-item', '<b>' + esc(r.title) + '</b><span>' + esc(r.sub) + '</span>');
    d.href = r.href;
    d.addEventListener('click', function () { drop.hidden = true; searchInput.blur(); });
    drop.appendChild(d);
  });
  drop.hidden = false;
}
searchInput.addEventListener('input', debounce(function (e) { doSearch(e.target.value); }, 120));
searchInput.addEventListener('blur', function () { setTimeout(function () { drop.hidden = true; }, 180); });
searchInput.addEventListener('keydown', function (e) {
  var items = $$('.sr-item', drop);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    selIdx = (selIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach(function (d, i) { d.classList.toggle('sel', i === selIdx); });
    items[selIdx].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && selIdx >= 0 && items[selIdx]) {
    location.hash = items[selIdx].getAttribute('href'); drop.hidden = true;
  } else if (e.key === 'Escape') { drop.hidden = true; searchInput.blur(); }
});
document.addEventListener('keydown', function (e) {
  var ae = document.activeElement, tag = ae ? ae.tagName : '';
  if (e.key === '/' && ae !== searchInput && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') { e.preventDefault(); searchInput.focus(); }
});

/* ---------- 菜单/抽屉 ---------- */
$('#btn-menu').addEventListener('click', function () { $('#sidebar').classList.toggle('open'); });
$('#btn-aside').addEventListener('click', function () { $('#aside').classList.toggle('open'); });
document.addEventListener('click', function (e) {
  if (window.innerWidth <= 980 && !e.target.closest('#sidebar') && !e.target.closest('#btn-menu')) $('#sidebar').classList.remove('open');
  if (window.innerWidth <= 1200 && !e.target.closest('#aside') && !e.target.closest('#btn-aside')) $('#aside').classList.remove('open');
});
$('#brand').addEventListener('click', function () { location.hash = '#/ch/s0'; });

/* ---------- 完成按钮 ---------- */
$('#btn-done').addEventListener('click', function () {
  if (!currentId) return;
  var pr = chProg(currentId);
  pr.done = !pr.done; saveProg();
  refreshSidebar(); refreshProgress();
  this.classList.toggle('did', pr.done);
  this.textContent = pr.done ? '✓ 已完成' : '标记本章完成';
  toast(pr.done ? '已完成本章' : '已取消完成');
});

/* ---------- 路由 ---------- */
function route() {
  var h = location.hash || '#/ch/s0';
  var m = h.match(/^#\/ch\/([a-z0-9-]+)/i);
  if (m) { renderChapter(m[1]); return; }
  if (h.indexOf('#/glossary') === 0) { renderGlossary(); return; }
  location.hash = '#/ch/s0';
}
window.addEventListener('hashchange', route);

/* ---------- 启动 ---------- */
function boot() {
  if (!CH.length) { $('#content').innerHTML = '<p>章节数据加载失败。</p>'; return; }
  buildIndex();
  refreshSidebar();
  refreshProgress();
  route();
}
boot();

/* 暴露给测试 */
window.__ETC_TEST = { chapters: CH, prog: function () { return PROG; }, route: route, search: doSearch, index: function () { return INDEX; } };
})();

</script>
</body>
